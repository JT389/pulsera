<div class="tab-page active">

  <div class="section-card">
    <div class="section-title">Demographics</div>

    <label>First Name</label>
    <input id="firstName">

    <label>Last Name</label>
    <input id="lastName">

    <label>Date of Birth</label>
    <input id="dob" type="date">

    <label>Gender</label>
    <select id="gender">
      <option value="">Select</option>
      <option>M</option>
      <option>F</option>
      <option>Other</option>
    </select>
  </div>

  <div class="section-card">
    <div class="section-title">Chief Complaint</div>
    <textarea id="chiefComplaint"></textarea>
  </div>

</div>

<script type="module">
import { supabase } from "../js/supabase.js";

const EPCR_ID = localStorage.getItem("currentEpcrId");

// Load EPCR Data
(async () => {
  const { data } = await supabase
    .from("epcr_demographics")
    .select("*")
    .eq("epcr_id", EPCR_ID)
    .single();

  if (!data) return;

  document.getElementById("firstName").value = data.first_name ?? "";
  document.getElementById("lastName").value = data.last_name ?? "";
  document.getElementById("dob").value = data.dob ?? "";
  document.getElementById("gender").value = data.gender ?? "";
  document.getElementById("chiefComplaint").value = data.chief_complaint ?? "";
})();

// Autosave Engine
const fields = ["firstName", "lastName", "dob", "gender", "chiefComplaint"];

fields.forEach(id => {
  document.getElementById(id).addEventListener("input", () => save());
});

async function save() {
  await supabase.from("epcr_demographics").upsert({
    epcr_id: EPCR_ID,
    first_name: firstName.value,
    last_name: lastName.value,
    dob: dob.value,
    gender: gender.value,
    chief_complaint: chiefComplaint.value
  });

  document.getElementById("autosave").textContent = "Saved";
}
</script>

<div class="tab-page active">

  <!-- DEMOGRAPHICS -->
  <div class="section-card">
    <div class="section-title">Demographics</div>

    <div class="form-grid">
      <div>
        <label>First Name</label>
        <input id="firstName" class="input-field">
      </div>

      <div>
        <label>Last Name</label>
        <input id="lastName" class="input-field">
      </div>

      <div>
        <label>Date of Birth</label>
        <input id="dob" type="date" class="input-field">
      </div>

      <div>
        <label>Gender</label>
        <select id="gender" class="input-field">
          <option value="">Select</option>
          <option>M</option>
          <option>F</option>
          <option>Other</option>
        </select>
      </div>
    </div>
  </div>

  <!-- CHIEF COMPLAINT -->
  <div class="section-card">
    <div class="section-title">Chief Complaint</div>
    <textarea id="chiefComplaint" class="textarea-field"></textarea>
  </div>

</div>

<script type="module">
import { supabase } from "../js/supabase.js";

const EPCR_ID = localStorage.getItem("currentEpcrId");

/* -----------------------------------------
   LOAD DATA
----------------------------------------- */
(async () => {
  const { data } = await supabase
    .from("epcr_demographics")
    .select("*")
    .eq("epcr_id", EPCR_ID)
    .single();

  if (!data) return;

  firstName.value = data.first_name ?? "";
  lastName.value = data.last_name ?? "";
  dob.value = data.dob ?? "";
  gender.value = data.gender ?? "";
  chiefComplaint.value = data.chief_complaint ?? "";
})();

/* -----------------------------------------
   AUTOSAVE ENGINE
----------------------------------------- */

const fields = ["firstName", "lastName", "dob", "gender", "chiefComplaint"];

fields.forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    document.getElementById("autosave").textContent = "Saving…";
    save();
  });
});

let saveTimer = null;

async function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {

    await supabase.from("epcr_demographics").upsert({
      epcr_id: EPCR_ID,
      first_name: firstName.value,
      last_name: lastName.value,
      dob: dob.value,
      gender: gender.value,
      chief_complaint: chiefComplaint.value
    });

    document.getElementById("autosave").textContent = "Saved";
  }, 400);
}
</script>

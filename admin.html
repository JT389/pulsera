<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulsera Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/admin.js" defer></script>
</head>

<body class="app-body">

<header class="pulsera-header">
  <img src="https://i.imgur.com/ogSYUG6.png" class="incident-logo">
  <button class="pulsera-btn" onclick="location.href='dashboard.html'">Back</button>
</header>

<div class="pulsera-container">
  <h2>Create User</h2>

  <form id="createUserForm" class="pulsera-form">
    <label>Email</label>
    <input type="email" id="email">

    <label>Password</label>
    <input type="password" id="password">

    <label>Name</label>
    <input type="text" id="name">

    <label>Role</label>
    <select id="role">
      <option value="medic">Medic</option>
      <option value="supervisor">Supervisor</option>
      <option value="admin">Admin</option>
    </select>

    <label>Unit</label>
    <input type="text" id="unit">

    <button class="pulsera-btn-full" type="submit">Create User</button>
  </form>

</div>

</body>
</html>
